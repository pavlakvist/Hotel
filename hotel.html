<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotelven – Hotellet</title>
  <link rel="stylesheet" href="css/stil.css">
</head>
<body>
  <header>
    <a href="index.html" class="tilbage">&larr; Forside</a>
    <h1>Hotelven</h1>
  </header>

  <main>
    <!-- Selve spillet bliver tegnet på dette "lærred" -->
    <canvas id="spil" width="900" height="600"></canvas>

    <aside id="panel">
      <button id="panel-knap" class="panel-knap" title="Skjul eller vis panelet">✕</button>
      <div class="rum-boks">
        <span class="lille">Du er i</span>
        <h2 id="rum-navn">Velkomsthallen</h2>
      </div>

      <div id="hal-sektion">
        <p class="lille">Her mødes alle gæster, når de tjekker ind. Gå gennem døren under skiltet for at komme til dit eget værelse.</p>
        <button id="knap-til-vaerelse" class="stor-knap">Gå til mit værelse &rarr;</button>
      </div>

      <div id="moebel-sektion" hidden>
      <button id="knap-til-hal" class="stor-knap">&larr; Til velkomsthallen</button>
      <h2>Møbler</h2>
      <p class="lille">Klik på et møbel og derefter på gulvet for at stille det.</p>
      <div id="moebel-faner"></div>
      <div id="moebel-knapper"></div>

      <div id="valgt-boks" hidden>
        <h3 id="valgt-navn"></h3>
        <button id="knap-drej">Drej (R)</button>
        <button id="knap-saml">Saml op</button>
      </div>

      <button id="knap-ryd" class="diskret">Ryd hele rummet</button>
      </div>

      <h2>Garderobe</h2>
      <div id="garderobe">
        <canvas id="figur-forhaandsvisning" width="132" height="130"></canvas>
      </div>
      <button id="knap-garderobe">Skift udseende</button>
    </aside>
  </main>

  <!-- "Skift udseende": vælg figur, tøj og farver. Åbnes med knappen i panelet -->
  <div id="garderobe-vindue" hidden>
    <div class="su-boks" role="dialog" aria-labelledby="su-titel">
      <div class="su-top">
        <h2 id="su-titel">Skift udseende</h2>
        <button id="gv-luk" class="su-luk" title="Luk uden at gemme">✕</button>
      </div>
      <div id="su-faner" class="su-faner"></div>
      <div class="su-indhold">
        <div class="su-venstre">
          <div id="su-under" class="su-under"></div>
          <div id="su-ting" class="su-ting"></div>
        </div>
        <div class="su-hoejre">
          <div class="su-scene">
            <canvas id="su-figur" width="220" height="340"></canvas>
            <button id="su-drej-venstre" class="su-pil venstre" title="Drej">⟲</button>
            <button id="su-drej-hoejre" class="su-pil hoejre" title="Drej">⟳</button>
          </div>
          <div class="su-knapper">
            <button id="su-fortryd" title="Fortryd">↶</button>
            <button id="su-fjern" title="Fjern farven her">🗑</button>
            <button id="gv-tilfaeldig" title="Tilfældigt udseende">🎲</button>
          </div>
          <button id="su-gem" class="su-gem">Gem ændringer</button>
        </div>
      </div>
    </div>
  </div>

  <footer id="besked">Klik på gulvet for at gå.</footer>

  <!-- Chatten: skriv noget, så kommer det i en taleboble over din figur -->
  <form id="chat" autocomplete="off">
    <button type="button" id="chat-smiley-knap" class="chat-lille" title="Smileyer">😊</button>
    <button type="button" id="chat-farve-knap" class="chat-lille" title="Farve på din taleboble"></button>
    <input id="chat-tekst" type="text" maxlength="100" placeholder="Skriv noget og tryk Enter …">
    <button type="submit">Send</button>
    <div id="chat-smileyer" class="chat-valg" hidden></div>
    <div id="chat-farver" class="chat-valg farver" hidden></div>
  </form>

  <!-- Rækkefølgen er vigtig: indstillingerne skal hentes før spillet -->
  <script src="js/indstillinger.js"></script>
  <script src="js/moebel-katalog.js"></script>
  <script src="js/figur.js"></script>
  <script src="js/toej.js"></script>
  <script src="js/toej-farver.js"></script>
  <script src="js/frisurer.js"></script>
  <script src="js/bukser.js"></script>
  <script src="js/spil.js"></script>
  <script src="js/velkomsthal.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/garderobe.js"></script>
</body>
</html>
